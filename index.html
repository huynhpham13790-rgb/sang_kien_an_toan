<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đúng hàng – Đúng phương tiện | Demo TP.HCM</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #f4f6f8; color: #1d2733; }
  .banner { background: #c62828; color: #fff; text-align: center; padding: 8px; font-weight: 600; font-size: 14px; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; margin: 8px 0 4px; }
  .sub { color: #5b6773; margin: 0 0 16px; font-size: 14px; }
  label { display: block; font-weight: 600; margin: 12px 0 4px; }
  select, input, button { width: 100%; font-size: 16px; padding: 10px; border: 1px solid #c8d0d8; border-radius: 8px; background: #fff; }
  button { margin-top: 16px; background: #1565c0; color: #fff; border: 0; font-weight: 600; cursor: pointer; }
  .card { background: #fff; border-radius: 10px; padding: 14px; margin-top: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .card h2 { font-size: 16px; margin: 0 0 6px; }
  .ok { color: #2e7d32; font-weight: 600; }
  .warn { color: #c62828; font-weight: 600; }
  ul { padding-left: 18px; margin: 6px 0; }
  .tag { background: #fff3e0; color: #e65100; font-size: 12px; font-weight: 600; padding: 2px 6px; border-radius: 6px; }
  .src { font-size: 12px; color: #5b6773; margin: 8px 0 0; }
  footer { font-size: 12px; color: #5b6773; text-align: center; padding: 20px 16px; }
</style>
</head>
<body>
<div class="banner">⚠ DỮ LIỆU MẪU – chưa đối chiếu văn bản chính thức. Chỉ để minh họa.</div>
<main>
  <h1>Đúng hàng – Đúng phương tiện</h1>
  <p class="sub">Kiểm tra nhanh tuyến đường, tải trọng, hạng bằng lái và mức phạt cho xe chở hàng tại TP.HCM.</p>

  <form id="form">
    <label for="vehicle">Loại xe</label>
    <select id="vehicle" required></select>
    <label for="cargo">Loại hàng</label>
    <select id="cargo" required></select>
    <label for="load">Khối lượng hàng (tấn)</label>
    <input id="load" type="text" inputmode="decimal" required placeholder="vd. 3,5">
    <button type="submit">Kiểm tra</button>
  </form>

  <div id="result"></div>
</main>
<footer>Bản demo dự thi Sáng kiến ATGT 2026 · <span id="ver"></span></footer>
<script src="app.js"></script>
</body>
</html>
